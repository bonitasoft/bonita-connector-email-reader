Email Reader.category=Email Reader
connectorDefinitionLabel=[BETA] Email Reader - Search Emails
connectorDefinitionDescription=Search for emails matching specific criteria (sender, subject, date range, read status)

connectionPage.pageTitle=Connection
connectionPage.pageDescription=Configure IMAP server connection and authentication

searchPage.pageTitle=Search Criteria
searchPage.pageDescription=Define search criteria to find matching emails

imapHostWidget.label=IMAP Host
imapHostWidget.description=IMAP server hostname (e.g., imap.gmail.com, outlook.office365.com)

imapPortWidget.label=IMAP Port
imapPortWidget.description=IMAP server port (993 for IMAPS, 143 for plain IMAP)

usernameWidget.label=Username
usernameWidget.description=Email account username (full email address for Gmail/Exchange Online)

passwordWidget.label=Password
passwordWidget.description=Account password or app-specific password (required when authMode=PASSWORD)

authModeWidget.label=Authentication Mode
authModeWidget.description=PASSWORD for username/password, OAUTH2 for Exchange Online/Gmail OAuth2

oauth2AccessTokenWidget.label=OAuth2 Access Token
oauth2AccessTokenWidget.description=OAuth2 access token for XOAUTH2 authentication (required when authMode=OAUTH2)

useTlsWidget.label=Use TLS
useTlsWidget.description=Use TLS/SSL encryption (IMAPS on port 993)

connectTimeoutWidget.label=Connection Timeout (ms)
connectTimeoutWidget.description=Connection timeout in milliseconds

readTimeoutWidget.label=Read Timeout (ms)
readTimeoutWidget.description=Read/socket timeout in milliseconds

folderNameWidget.label=Folder Name
folderNameWidget.description=Folder to search in

searchFromWidget.label=From
searchFromWidget.description=Filter by sender email address (partial match supported)

searchSubjectWidget.label=Subject
searchSubjectWidget.description=Filter by subject (substring match)

searchSinceWidget.label=Since Date
searchSinceWidget.description=Filter emails received on or after this date (yyyy-MM-dd)

searchBeforeWidget.label=Before Date
searchBeforeWidget.description=Filter emails received before this date (yyyy-MM-dd)

searchReadStatusWidget.label=Read Status
searchReadStatusWidget.description=Filter by read status: ALL, UNREAD, or READ

maxResultsWidget.label=Max Results
maxResultsWidget.description=Maximum number of search results to return (1-1000)
